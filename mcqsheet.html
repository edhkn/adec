<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TLS ADEC - MCQ ANSWER SHEET</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f7f6; padding: 20px; }
    .form-container { background: #ffffff; padding: 30px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); max-width: 800px; margin: auto; }
    h2 { color: #16a085; font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid #16a085; padding-bottom: 10px; }
    .question-block { background: #f4fcfa; border-left: 4px solid #16a085; padding: 15px; margin-bottom: 12px; border-radius: 4px; display: flex; align-items: center; justify-content: space-between;}
    .question-title { font-weight: 700; color: #2c3e50; font-size: 1.1rem; width: 120px; }
    .options-group { display: flex; gap: 20px; flex-grow: 1;}
    .form-check-label { font-weight: bold; cursor: pointer; font-size: 1.1rem; padding-left: 5px; }
    .form-check-input { width: 1.2rem; height: 1.2rem; cursor: pointer; }
    .form-check-input:checked { background-color: #16a085; border-color: #16a085; }
    
    @media (max-width: 500px) {
      .question-block { flex-direction: column; align-items: flex-start; gap: 10px; }
      .options-group { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>

<div class="form-container">
  <h2 class="text-center">TLS ADEC - MCQ ANSWER SHEET (40 Questions)</h2>

  <form id="assessmentForm" onsubmit="event.preventDefault(); submitAssessment();">
    
    <!-- STUDENT NAME DROPDOWN -->
    <div class="mb-4">
      <label class="form-label fw-bold fs-5">NAME OF PARTICIPANT:</label>
      <select class="form-select form-select-lg border-2" id="studentName" required>
        <option value="" disabled selected>Select participant name...</option>
        <option value="ABDUL LATIFF BIN SHARI">ABDUL LATIFF BIN SHARI</option>
        <option value="AHMAD AZIM AFIFI BIN SHARUPUDDIN">AHMAD AZIM AFIFI BIN SHARUPUDDIN</option>
        <option value="AKMAL RIDHWAN BIN YUSRIZAL">AKMAL RIDHWAN BIN YUSRIZAL</option>
        <option value="ARIF AKMAL BIN ABDUL WAHAB">ARIF AKMAL BIN ABDUL WAHAB</option>
        <option value="BUVANESWARY A/P PUSHPARAJAH">BUVANESWARY A/P PUSHPARAJAH</option>
        <option value="CHIN HUI ZHI">CHIN HUI ZHI</option>
        <option value="HARISAH BINTI OMAR">HARISAH BINTI OMAR</option>
        <option value="MOHAMAD FADZIL BIN ROMLI">MOHAMAD FADZIL BIN ROMLI</option>
        <option value="MOHAMAD NIZAM BIN MOHAMAD BAKRI">MOHAMAD NIZAM BIN MOHAMAD BAKRI</option>
        <option value="MOHD FIRDAUS BIN MUSA">MOHD FIRDAUS BIN MUSA</option>
        <option value="MOHD RAIMI SHAFRY BIN ROSAIDI">MOHD RAIMI SHAFRY BIN ROSAIDI</option>
        <option value="MOHD SYAFIQ BIN ISMAIL">MOHD SYAFIQ BIN ISMAIL</option>
        <option value="PERREVITHA A/P KRISHNAN">PERREVITHA A/P KRISHNAN</option>
        <option value="ROSLINA BINTI MOHAMED OMAR">ROSLINA BINTI MOHAMED OMAR</option>
        <option value="SITI NOORDIYANA BINTI MOHD ROSDI">SITI NOORDIYANA BINTI MOHD ROSDI</option>
        <option value="SITI NURJANNAH BINTI HANIZAN">SITI NURJANNAH BINTI HANIZAN</option>
        <option value="THIBACINI A/P MOHAN">THIBACINI A/P MOHAN</option>
        <option value="ZAINAB BINTI HASAN">ZAINAB BINTI HASAN</option>
        <option value="ZAYANI ADLINA BINTI ZALIZAN">ZAYANI ADLINA BINTI ZALIZAN</option>
      </select>
    </div>

    <hr class="my-4">
    <h4 class="mb-3 text-secondary">Answer Sheet</h4>

    <!-- GENERATE 40 QUESTIONS DYNAMICALLY -->
    <script>
      for (let i = 1; i <= 40; i++) {
        document.write(`
          <div class="question-block">
            <div class="question-title">Question ${i}</div>
            <div class="options-group">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="q${i}" id="q${i}_A" value="A" required>
                <label class="form-check-label text-primary" for="q${i}_A">A</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="q${i}" id="q${i}_B" value="B">
                <label class="form-check-label text-primary" for="q${i}_B">B</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="q${i}" id="q${i}_C" value="C">
                <label class="form-check-label text-primary" for="q${i}_C">C</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="q${i}" id="q${i}_D" value="D">
                <label class="form-check-label text-primary" for="q${i}_D">D</label>
              </div>
            </div>
          </div>
        `);
      }
    </script>

    <div class="d-grid gap-2 mt-5">
      <button type="submit" id="submitBtn" class="btn btn-success btn-lg fs-4" style="background-color: #16a085; border-color: #16a085;">Submit MCQ Answers</button>
    </div>

    <div id="statusAlert" class="alert mt-3" style="display:none; font-size: 1.1rem; font-weight: bold;"></div>
  </form>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyG2c-f6h2yJSlSwa6yuANjKnscsH-S9S1lNih9YFRx4WMH_vFRDOw8CnSHVoI51_02/exec";

  function submitAssessment() {
    const submitBtn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('statusAlert');
    
    submitBtn.disabled = true;
    submitBtn.innerText = "Grading & Submitting Data...";
    alertBox.style.display = "none";

    // Setup Payload
    const payload = {
      formType: "MCQ",
      studentName: document.getElementById('studentName').value
    };

    // Grab all 40 selected radio buttons
    for (let i = 1; i <= 40; i++) {
      let selectedOption = document.querySelector(`input[name="q${i}"]:checked`);
      payload[`q${i}`] = selectedOption ? selectedOption.value : "";
    }

    // Send to Google Sheet
    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      document.getElementById('assessmentForm').reset();
      submitBtn.disabled = false;
      submitBtn.innerText = "Submit MCQ Answers";
      alertBox.className = "alert alert-success mt-3 text-center";
      alertBox.innerText = "MCQ Answers submitted and graded successfully in Google Sheets!";
      alertBox.style.display = "block";
      
      // Auto-scroll to message and clear after 5s
      window.scrollTo(0, document.body.scrollHeight);
      setTimeout(() => { alertBox.style.display = "none"; }, 5000);
    })
    .catch(error => {
      submitBtn.disabled = false;
      submitBtn.innerText = "Submit MCQ Answers";
      alertBox.className = "alert alert-danger mt-3 text-center";
      alertBox.innerText = "Submission failed: " + error.message;
      alertBox.style.display = "block";
    });
  }
</script>

</body>
</html>
