<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TLS ADEC - PRIMARY SURVEY STATION</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f7f6; padding: 20px; }
    .form-container { background: #ffffff; padding: 30px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); max-width: 800px; margin: auto; }
    h2 { color: #c0392b; font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid #c0392b; padding-bottom: 10px; }
    .scenario-box { background-color: #fce4ec; padding: 15px; border-radius: 5px; border-left: 5px solid #e91e63; margin-bottom: 20px; color: #880e4f; font-size: 1.05rem; }
    .question-block { background: #fafafa; border-left: 4px solid #c0392b; padding: 15px; margin-bottom: 15px; border-radius: 4px; }
    .question-title { font-weight: 600; margin-bottom: 8px; color: #2c3e50; }
  </style>
</head>
<body>

<div class="form-container">
  <h2 class="text-center">TLS ADEC - PRIMARY SURVEY STATION</h2>
  
  <div class="scenario-box fw-bold">
    📋 Scenario: <span class="fw-normal">You’re attending a trauma patient IN THE RED ZONE. 20 YEARS OLD, MVA MB VS CAR. Please proceed.</span><br>
    ⚠️ INJURY: <span class="text-danger">TENSION PNEUMOTHORAX</span><br>
    🧠 GCS: <span class="text-primary">E3V4M5</span>
  </div>

  <form id="assessmentForm" onsubmit="event.preventDefault(); submitAssessment();">
    
    <div class="mb-4">
      <label class="form-label fw-bold">NAME :</label>
      <select class="form-select" id="studentName" required>
        <option value="" disabled selected>Select student name...</option>
        <option value="ABDUL LATIFF BIN SHARI">ABDUL LATIFF BIN SHARI</option>
        <option value="AHMAD AZIM AFIFI BIN SHARUPUDDIN">AHMAD AZIM AFIFI BIN SHARUPUDDIN</option>
        <option value="AKMAL RIDHWAN BIN YUSRIZAL">AKMAL RIDHWAN BIN YUSRIZAL</option>
        <option value="ARIF AKMAL BIN ABDUL WAHAB">ARIF AKMAL BIN ABDUL WAHAB</option>
        <option value="BUVANESWARY A/P PUSHPARAJAH">BUVANESWARY A/P PUSHPARAJAH</option>
        <option value="CHIN HUI ZHI">CHIN HUI ZHI</option>
        <option value="HARISAH BINTI OMAR">HARISAH BINTI OMAR</option>
        <option value="MOHAMAD FADZIL BIN ROMLI">MOHAMAD FADZIL BIN ROMLI</option>
        <option value="MOHAMAD NIZAM BIN MOHAMAD BAKRI">MOHAMAD NIZAM BIN MOHAMAD BAKRI</option>
        <option value="MOHD FIRDAUS BIN MUSA">MOHD FIRDAUS BIN MUSA</option>
        <option value="MOHD RAIMI SHAFRY BIN ROSAIDI">MOHD RAIMI SHAFRY BIN ROSAIDI</option>
        <option value="MOHD SYAFIQ BIN ISMAIL">MOHD SYAFIQ BIN ISMAIL</option>
        <option value="PERREVITHA A/P KRISHNAN">PERREVITHA A/P KRISHNAN</option>
        <option value="ROSLINA BINTI MOHAMED OMAR">ROSLINA BINTI MOHAMED OMAR</option>
        <option value="SITI NOORDIYANA BINTI MOHD ROSDI">SITI NOORDIYANA BINTI MOHD ROSDI</option>
        <option value="SITI NURJANNAH BINTI HANIZAN">SITI NURJANNAH BINTI HANIZAN</option>
        <option value="THIBACINI A/P MOHAN">THIBACINI A/P MOHAN</option>
        <option value="ZAINAB BINTI HASAN">ZAINAB BINTI HASAN</option>
        <option value="ZAYANI ADLINA BINTI ZALIZAN">ZAYANI ADLINA BINTI ZALIZAN</option>
      </select>
    </div>

    <h4 class="mb-3 text-secondary">Skill Checklist (1 point each)</h4>

    <script>
      const questions = [
        "Catastrophic hemorhage - stop external bleeding",
        "Airway + Cervical - jaw thrust - manual in-line immobilisation and application of cervical collar",
        "Breathing (distended neck vain on the right, hyperresonance on the right, subcutaneous emphysema on the right, trachea deviated to the left, reduced air entry on the right)",
        "Perform IPPA",
        "Detected tension pneumothorax",
        "Verbalise to perform finger thoracostomy",
        "Anatomy landmarks for finger thoracostomy",
        "CIRCULATION : check CCTVR",
        "Insert large bore branula",
        "Look for potential cause of hypovolaemic shock (chest, abdomen, pelvic, extremities)",
        "CHECK GCS : E3V4M5",
        "CHECK PUPILS : RIGHT 5mm LEFT 2mm",
        "EXPOSURE : PREVENT HYPOTHERMIA",
        "MENTION PRIMARY ADJUNCT: CXR PELVIS, EFAST, TRAUMA BLOOD PANEL, GXM, CBD, RYLE TUBE, ECG"
      ];

      questions.forEach((q, index) => {
        let qNum = index + 1;
        document.write(`
          <div class="question-block">
            <div class="question-title">${qNum}. ${q}</div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="item${qNum}" id="item${qNum}_done" value="DONE" required>
              <label class="form-check-label text-success fw-bold" for="item${qNum}_done">DONE</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="item${qNum}" id="item${qNum}_notdone" value="NOT DONE">
              <label class="form-check-label text-danger fw-bold" for="item${qNum}_notdone">NOT DONE</label>
            </div>
          </div>
        `);
      });
    </script>

    <hr class="my-4">
    
    <div class="mb-4 question-block" style="border-left-color: #2c3e50;">
      <label class="question-title fs-5">RESULT *</label><br>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="result" id="res_pass" value="PASS" required>
        <label class="form-check-label text-success fw-bold" for="res_pass">PASS</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="result" id="res_fail" value="FAILED">
        <label class="form-check-label text-danger fw-bold" for="res_fail">FAILED</label>
      </div>
    </div>

    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" id="instructorPotential" value="YES">
      <label class="form-check-label fw-bold text-primary" for="instructorPotential">INSTRUCTOR POTENTIAL</label>
    </div>

    <div class="mb-4">
      <label class="form-label fw-bold">NAME OF INSTRUCTOR :</label>
      <input type="text" class="form-control" id="instructorName" placeholder="Enter Instructor Name" required>
    </div>

    <div class="d-grid gap-2">
      <button type="submit" id="submitBtn" class="btn btn-danger btn-lg" style="background-color: #c0392b; border-color: #c0392b;">Submit Assessment</button>
    </div>

    <div id="statusAlert" class="alert mt-3" style="display:none;"></div>
  </form>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyG2c-f6h2yJSlSwa6yuANjKnscsH-S9S1lNih9YFRx4WMH_vFRDOw8CnSHVoI51_02/exec";

  function submitAssessment() {
    const submitBtn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('statusAlert');
    
    submitBtn.disabled = true;
    submitBtn.innerText = "Submitting Data...";
    alertBox.style.display = "none";

    const payload = {
      formType: "Primary_Survey",
      studentName: document.getElementById('studentName').value,
      result: document.querySelector('input[name="result"]:checked').value,
      instructorPotential: document.getElementById('instructorPotential').checked,
      instructorName: document.getElementById('instructorName').value
    };

    for (let i = 1; i <= 14; i++) {
      payload[`item${i}`] = document.querySelector(`input[name="item${i}"]:checked`).value;
    }

    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      document.getElementById('assessmentForm').reset();
      submitBtn.disabled = false;
      submitBtn.innerText = "Submit Assessment";
      alertBox.className = "alert alert-success mt-3";
      alertBox.innerText = "Primary Survey Assessment saved successfully to Google Sheet!";
      alertBox.style.display = "block";
      setTimeout(() => { alertBox.style.display = "none"; }, 5000);
    })
    .catch(error => {
      submitBtn.disabled = false;
      submitBtn.innerText = "Submit Assessment";
      alertBox.className = "alert alert-danger mt-3";
      alertBox.innerText = "Submission failed: " + error.message;
      alertBox.style.display = "block";
    });
  }
</script>

</body>
</html>
