<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TLS ADEC - Assessment Summary | Hospital Kuala Nerang</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --primary-navy: #1e293b;
      --accent-blue: #3498db;
      --accent-circ: #e67e22;
      --accent-immo: #8e44ad;
      --accent-primary: #c0392b;
      --accent-moulage: #4f46e5;
      --accent-mcq: #0f766e;
    }

    body {
      background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--primary-navy);
    }

    /* Floating Navigation */
    nav {
      position: sticky;
      top: 15px;
      z-index: 1000;
      max-width: 1200px;
      margin: 0 auto;
      width: calc(100% - 30px);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-radius: 50px;
      padding: 10px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      border: 1px solid rgba(226, 232, 240, 0.8);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: #2c3e50;
    }

    .dept-logo {
      height: 46px;
      width: auto;
      object-fit: contain;
    }

    .logo-text {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.2;
      display: flex;
      flex-direction: column;
    }

    .logo-text span {
      font-size: 0.78rem;
      font-weight: 500;
      color: #64748b;
    }

    .back-portal-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #2c3e50;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 7px 16px;
      border-radius: 25px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .back-portal-btn:hover {
      background: #2c3e50;
      color: #ffffff;
    }

    /* Main Container */
    .dashboard-wrapper {
      max-width: 1350px; /* Widened for the extra column */
      width: 100%;
      margin: 30px auto 60px;
      padding: 0 16px;
    }

    /* Metric Cards */
    .metric-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .metric-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }

    /* Table Container */
    .table-container {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
      border: 1px solid #e2e8f0;
      margin-top: 24px;
    }

    .table th {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      font-weight: 700;
      background-color: #f8fafc;
      vertical-align: middle;
      border-bottom: 2px solid #e2e8f0;
    }

    .table td {
      vertical-align: middle;
      font-size: 0.85rem;
      padding: 12px 8px;
    }

    .badge-status {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .badge-pass { background: #dcfce7; color: #15803d; }
    .badge-fail { background: #fee2e2; color: #b91c1c; }
    .badge-remedial { background: #fef08a; color: #854d0e; } /* Added for Moulage Remedial */
    .badge-pending { background: #f1f5f9; color: #64748b; }
    .badge-pot { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }

    /* Footer */
    footer {
      margin-top: auto;
      background: #ffffff;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      padding: 35px 20px;
    }

    .footer-container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
    .footer-logos { display: flex; align-items: center; gap: 16px; }
    .footer-logos img { height: 42px; width: auto; object-fit: contain; }
    .logo-divider { width: 1px; height: 30px; background-color: #dcdde1; }
    .footer-status { display: inline-flex; align-items: center; gap: 8px; background: #f8f9fa; border: 1px solid #edf2f7; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; color: #2d3436; }
    .pulse-dot { width: 8px; height: 8px; background-color: #2ecc71; border-radius: 50%; animation: pulse 1.8s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); } 70% { box-shadow: 0 0 0 8px rgba(46, 204, 113, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); } }
    .footer-copyright { font-size: 0.85rem; color: #95a5a6; margin: 0; }
    .footer-copyright span { font-weight: 600; color: #2c3e50; }
